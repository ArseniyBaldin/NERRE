<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NER Upload</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/static">Загрузка DOCX</a>
    </nav>
    <div class="container">
        <div class="left">
            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <button type="submit">Загрузить и подсветить</button>
            </form>
            <div class="text-block">
                {{ text|safe }}
            </div>
        </div>
<div class="right">
    <h3>Сущности</h3>

    <div class="legend">
        {% for ent_type in entity_types %}
            <div class="legend-item">
                <span class="legend-color entity {{ ent_type }}"></span>
                <span class="legend-label">{{ ent_type }}</span>
            </div>
        {% endfor %}
    </div>

    <hr>


<div class="entity-list">
    {% for label, items in entities_grouped.items() %}
        <div class="entity-type-block">
            <strong>{{ label }}</strong>:
            <ul>
                {% for item in items %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endfor %}
</div>

</div>

    </div>
<!--    <div class="text-block">-->
<!--    {{ text|safe }}-->
<!--</div>-->

<hr>
<h3>Граф взаимосвязей</h3>
<iframe src="/static/graph.html" width="100%" height="600" frameborder="0"></iframe>


</body>
</html>
